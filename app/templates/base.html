<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meeting Audit Bot Admin{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --success: #4ade80;
      --warning: #fbbf24;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-2);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-right: 1.2rem;
    }
    nav a:hover, nav a.active { color: var(--accent); }
    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1, h2, h3 { margin-top: 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-2);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1rem;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .stat { font-size: 2rem; font-weight: 700; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--surface-2); }
    th { color: var(--muted); font-weight: 600; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-success { background: rgba(74,222,128,0.15); color: var(--success); }
    .badge-error { background: rgba(248,113,113,0.15); color: var(--danger); }
    .badge-running { background: rgba(251,191,36,0.15); color: var(--warning); }
    .badge-base { background: rgba(56,189,248,0.15); color: var(--accent); }
    .badge-custom { background: rgba(167,139,250,0.15); color: #a78bfa; }
    a { color: var(--accent); }
    form label { display: block; margin: 0.8rem 0 0.3rem; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--surface-2);
      border-radius: var(--radius);
      color: var(--text);
    }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; min-height: 400px; }
    button {
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
    button.secondary { background: var(--surface-2); color: var(--text); }
    .pagination { margin-top: 1rem; }
    .pagination a { margin-right: 0.5rem; }
    .muted { color: var(--muted); }
    .error { color: var(--danger); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div><strong>Meeting Audit Bot</strong> <span class="muted">| Admin</span></div>
    <nav>
      <a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}">Dashboard</a>
      <a href="/admin/executions" class="{% if '/admin/executions' in request.url.path %}active{% endif %}">Executions</a>
      <a href="/admin/audit" class="{% if '/admin/audit' in request.url.path %}active{% endif %}">Audit</a>
      <a href="/admin/config" class="{% if '/admin/config' in request.url.path %}active{% endif %}">Config</a>
      <a href="/admin/prompts" class="{% if '/admin/prompts' in request.url.path %}active{% endif %}">Prompts</a>
      <form method="post" action="/admin/logout" style="display:inline">
        <button class="secondary" style="margin:0">Logout</button>
      </form>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
