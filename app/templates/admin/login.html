<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Meeting Audit Bot</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--surface-2);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    label { display: block; margin: 1rem 0 0.3rem; }
    input {
      width: 100%;
      padding: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--surface-2);
      border-radius: var(--radius);
      color: var(--text);
    }
    button {
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.7rem;
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      margin-top: 0.6rem;
    }
    .error { color: #f87171; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Meeting Audit Bot — Admin</h1>
    <p class="muted">Введите demo-токен для входа в панель управления.</p>
    <form method="post" action="/admin/login">
      <label for="token">Demo token</label>
      <input id="token" name="token" type="password" required autofocus>
      <button type="submit">Войти</button>
    </form>
    <form method="post" action="/admin/login/demo">
      <button type="submit" class="secondary">Войти в демо-режиме</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
